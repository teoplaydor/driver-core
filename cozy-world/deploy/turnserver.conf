# Минимальный coturn для голосового чата: apt install coturn, затем положи это в /etc/turnserver.conf
# и включи сервис (TURNSERVER_ENABLED=1 в /etc/default/coturn). Порты 3478 (udp/tcp) и 49152-65535 (udp)
# должны быть открыты в файрволе.

listening-port=3478
realm=play.example.com
fingerprint
lt-cred-mech
user=cozy:ПАРОЛЬ
no-multicast-peers
no-cli
# Если сервер за NAT, укажи внешний IP:
#external-ip=203.0.113.10
min-port=49152
max-port=65535
